name: Playgrounds

on:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
        with:
          packages: 'true'
      - name: Build the playgrounds
        run: npm run build:pages -- --skip-package-build
      - name: Skip a commit superseded on main
        id: current
        run: node .github/scripts/pages-current.mjs
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.current.outputs.deploy == 'true'
        with:
          path: dist-pages
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
        if: steps.current.outputs.deploy == 'true'
