name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Read the package out of the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/release-tag.mjs >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build the packages
        run: npm run build

      - name: Verify the build invariants
        run: npm run verify:dist

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Publish
        run: npm publish --workspace "$PACKAGE" --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
