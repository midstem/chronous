name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          install: 'false'
          registry-url: https://registry.npmjs.org

      - name: Read the package out of the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/release-tag.mjs >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build the packages
        run: npm run build

      - name: Verify the build invariants
        run: npm run verify:dist

      - name: Check formatting
        run: npm run format:check

      - name: Test maintenance checks
        run: npm run test:infra

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Install Chromium for Angular package validation
        if: env.PACKAGE == '@midstem/chronous-angular'
        run: npx playwright install --with-deps chromium

      - name: Verify the npm archive and framework compatibility
        run: node .github/scripts/verify-package.mjs "$PACKAGE" release

      - name: Publish
        run: npm publish --workspace "$PACKAGE" --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
