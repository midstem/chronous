name: Bug report
description: Report incorrect or unexpected behavior.
body:
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - '@midstem/chronous (core)'
        - '@midstem/chronous-react'
        - '@midstem/chronous-angular'
        - '@midstem/chronous-vue'
        - '@midstem/chronous-svelte'
        - Unsure
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Include the version from your package manager or lockfile.
    validations:
      required: true
  - type: input
    id: framework-version
    attributes:
      label: Framework version
      description: Include the framework version when using an adapter.
      placeholder: React 19.x
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior you observed and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give steps or a minimal reproduction. Include relevant event and calendar options.
      placeholder: |
        1. Configure ...
        2. Call or render ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: timezone-date
    attributes:
      label: Time zone and date
      description: For time-related behavior, include the time zone and a date/time that reproduces it.
      placeholder: America/New_York; 2026-03-08T01:30
  - type: input
    id: temporal
    attributes:
      label: Temporal environment
      description: Say whether the environment uses native Temporal, temporal-polyfill, or Chronous' Date fallback; include runtime version if known.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 145
  - type: input
    id: environment
    attributes:
      label: Runtime and operating system
      placeholder: Node.js 24, macOS 26
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add console errors or links that may help reproduce the issue.
